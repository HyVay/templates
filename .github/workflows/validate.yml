name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rules:
    name: Aturan template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate.mjs

  build:
    name: Uji bangun Astro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scaffold/package.json
      - run: node scripts/build-test.mjs
